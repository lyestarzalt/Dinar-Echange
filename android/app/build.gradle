plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.dinarexchange.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.dinarexchange.app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def signingKeyPath = System.getenv("SIGNING_KEY_PATH")
            if (signingKeyPath != null) {
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                storeFile file(signingKeyPath)
                storePassword System.getenv("SIGNING_KEY_STORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def isReleaseBuild = graph.allTasks.any {
        def name = it.name.toLowerCase()
        (name.contains('assemblerelease') || name.contains('bundlerelease'))
    }
    if (isReleaseBuild && System.getenv("SIGNING_KEY_PATH") == null) {
        throw new GradleException(
            "SIGNING_KEY_PATH environment variable is not set. " +
            "Set SIGNING_KEY_PATH, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD, " +
            "and SIGNING_KEY_STORE_PASSWORD before running a release build."
        )
    }
}

flutter {
    source '../..'
}

dependencies {}
configurations.all { 
    exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
}
