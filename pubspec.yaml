name: dinar_echange
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.4.8+45

# Documenting the current Flutter and Dart SDK versions used in development:
# Flutter (Channel stable, 3.22.1, on Microsoft Windows [Version 10.0.22631.3155], locale en-MY)
# Dart SDK version: 3.4.1 (stable) (Tue May 21 15:46:25 2024 +0000) on "windows_x64"

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  logger: ^2.7.0
  firebase_auth: ^6.6.0
  cached_network_image: ^3.4.1
  animations: ^3.0.0
  provider: ^6.1.5
  firebase_core: ^4.14.0
  flutter_native_splash: ^2.4.8
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  cloud_firestore: ^6.9.0
  flutter_localizations:
    sdk: flutter
  firebase_messaging: ^16.6.0
  google_mobile_ads: ^9.1.0
  dio: ^5.11.0
  flutter_html: ^3.0.0
  package_info_plus: ^10.2.1
  flutter_gen: any
  in_app_review: ^2.0.12
  firebase_remote_config: ^6.6.0
  app_tracking_transparency: ^2.0.7
  shimmer: ^4.0.0
  google_fonts: ^8.2.1
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  arb_generator:

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/dz_flag.png
    - assets/terms_and_conditions.html
    - assets/privacy_policy.html
    - assets/logo/light_large.png
    - assets/flags/
  fonts:
    - family: Geologica
      fonts:
        - asset: fonts/Geologica-Regular.ttf
        - asset: fonts/Geologica-Bold.ttf
          weight: 500

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#c0efb0"
  image: "assets/logo/light.png"
  #
  color_dark: "#406836"
  image_dark: "assets/logo/light.png"

  android_12:
    image: "assets/logo/light.png"
    color: "#c0efb0"
    icon_background_color: "#c0efb0"
    image_dark: "assets/logo/dark.png"
    color_dark: "#406836"
    icon_background_color_dark: "#406836"
  web: false

arb_generator:
  input_filepath: "assets/multilingual_content.csv"
  output_directory: "lib/l10n"
  filename_prepend: "app_"
  csv_settings:
    delimiter: ","
    description_index: 1
    base_index: 2

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  arb-dir: lib/l10n
  output-dir: lib/l10n
  output-localization-file: lib/l10n/app_localizations.dart
